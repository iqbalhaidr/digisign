# Uji Integrasi Pipeline CI/CD
name: test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/test.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}:1.0.0@sha256:046d973f54c64d776252465c3a4c0da0c75bd2d32f1e20965a2c3fb4c8a0077a

jobs:
  # =========================================================================
  c01:
    name: "C01"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - algo: rsa-pss-sha256
            secret_name: CI_SIGNING_KEY_RSA
          - algo: ecdsa-p256-sha256
            secret_name: CI_SIGNING_KEY_ECDSA
          - algo: ed25519
            secret_name: CI_SIGNING_KEY_ED25519
    env:
      FOLDER: c01_${{ matrix.algo }}
    steps:
      - name: C01 - Checkout repository
        uses: actions/checkout@v7

      - name: C01 - Setup folder for artifacts
        run: |
          set -eu
          : "${FOLDER:?mandatory}"
          mkdir -p $FOLDER $FOLDER/dist $FOLDER/out

      - name: C01 - Pull tool image
        run: |
          set -eu
          : "${IMAGE:?mandatory}"
          docker pull "$IMAGE"

      - name: C01 - Build artifact
        run: |
          set -eu
          zip -j $FOLDER/dist/contoh-app.zip test/ci/contoh-app.txt

      - name: C01 - Sign manifest
        env:
          SIGNING_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          set -eu
          : "${SIGNING_KEY:?mandatory}"

          # Berkas kunci privat sementara dari secret CI/CD
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' 0
          printf "%s\n" "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 400 "$SIGNING_KEY_FILE"

          # Sign
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
            "$IMAGE" sign --file /input/contoh-app.zip \
            --package contoh-app --version 1.0.0 \
            --key /run/signing.key.pem --out /output/rilis.json

      - name: C01 - Verify release
        run: |
          set -eu

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output:ro" \
            -v "$PWD/test/ci/trust.json:/trust.json:ro" \
            "$IMAGE" verify --file /input/contoh-app.zip \
            --bundle /output/rilis.json --trust-store /trust.json \
            --package contoh-app --version 1.0.0 --json \
            > $FOLDER/verification.json

      - name: C01 - Publish or deploy
        run: |
          set -eu

          # Simulasi deploy dengan pembuatan berkas penanda
          echo "[C01] DEPLOYED: contoh-app v1.0.0 (${{ matrix.algo }})" > $FOLDER/out/deploy.marker

      - name: C01 - Upload evidence
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}

  # =========================================================================
  c02:
    name: "C02"
    runs-on: ubuntu-latest
    env:
      FOLDER: c02
    steps:
      - name: C02 - Checkout repository
        uses: actions/checkout@v7

      - name: C02 - Setup folder for artifacts
        run: |
          set -eu
          : "${FOLDER:?mandatory}"
          mkdir -p "$FOLDER" "$FOLDER/dist" "$FOLDER/out"

      - name: C02 - Pull tool image
        run: |
          set -eu
          : "${IMAGE:?mandatory}"
          docker pull "$IMAGE"

      - name: C02 - Build artifact
        run: |
          set -eu
          zip -j $FOLDER/dist/contoh-app.zip test/ci/contoh-app.txt

      - name: C02 - Sign manifest
        env:
          SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY_ED25519 }}
        run: |
          set -eu
          : "${SIGNING_KEY:?mandatory}"

          # Berkas kunci privat sementara dari secret CI/CD
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' 0
          printf "%s\n" "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 400 "$SIGNING_KEY_FILE"

          # Sign artefak asli
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
            "$IMAGE" sign --file /input/contoh-app.zip \
            --package contoh-app --version 1.0.0 \
            --key /run/signing.key.pem --out /output/rilis.json

      - name: C02 - Tamper artifact
        run: |
          set -eu
          # Ubah tepat 1 byte pertama pada artefak tanpa mengubah ukuran & nama berkas
          python3 -c '
          with open("c02/dist/contoh-app.zip", "r+b") as f:
              b = f.read(1)
              f.seek(0)
              f.write(bytes([b[0] ^ 0xFF]))
          '

      - name: C02 - Verify release
        run: |
          set -u

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output:ro" \
            -v "$PWD/test/ci/trust.json:/trust.json:ro" \
            "$IMAGE" verify --file /input/contoh-app.zip \
            --bundle /output/rilis.json --trust-store /trust.json \
            --package contoh-app --version 1.0.0 --json \
            > "$FOLDER/verification.json"

      - name: C02 - Publish or deploy
        run: |
          set -eu

          # Simulasi deploy dengan pembuatan berkas penanda
          echo "[C02] DEPLOYED: contoh-app v1.0.0 (ed25519)" > $FOLDER/out/deploy.marker

      - name: C02 - Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}

  # =========================================================================
  c03:
    name: "C03"
    runs-on: ubuntu-latest
    env:
      FOLDER: c03
    steps:
      - name: C03 - Checkout repository
        uses: actions/checkout@v7

      - name: C03 - Setup folder for artifacts
        run: |
          set -eu
          : "${FOLDER:?mandatory}"
          mkdir -p "$FOLDER" "$FOLDER/dist" "$FOLDER/out"

      - name: C03 - Pull tool image
        run: |
          set -eu
          : "${IMAGE:?mandatory}"
          docker pull "$IMAGE"

      - name: C03 - Build artifact
        run: |
          set -eu
          zip -j "$FOLDER/dist/contoh-app.zip" test/ci/contoh-app.txt

      - name: C03 - Sign manifest
        env:
          SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY_ED25519 }}
        run: |
          set -eu
          : "${SIGNING_KEY:?mandatory}"

          # Berkas kunci privat sementara dari secret CI/CD
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' 0
          printf "%s\n" "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 400 "$SIGNING_KEY_FILE"

          # Sign
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
            "$IMAGE" sign --file /input/contoh-app.zip \
            --package contoh-app --version 1.0.0 \
            --key /run/signing.key.pem --out /output/rilis.json

      - name: C03 - Verify release
        run: |
          set -u

          # Trust store kosong
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output:ro" \
            -v "$PWD/test/ci/trust_empty.json:/trust.json:ro" \
            "$IMAGE" verify --file /input/contoh-app.zip \
            --bundle /output/rilis.json --trust-store /trust.json \
            --package contoh-app --version 1.0.0 --json \
            > "$FOLDER/verification.json"

      - name: C03 - Publish or deploy
        run: |
          set -eu
          # Simulasi deploy dengan pembuatan berkas penanda (otomatis dilewati jika verify gagal)
          echo "[C03] DEPLOYED: contoh-app v1.0.0 (ed25519)" > "$FOLDER/out/deploy.marker"

      - name: C03 - Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}
  
  # =========================================================================
  
  c04:
    name: "C04"
    runs-on: ubuntu-latest
    env:
      FOLDER: c04
    steps:
      - name: C04 - Checkout repository
        uses: actions/checkout@v7

      - name: C04 - Setup folder for artifacts
        run: |
          set -eu
          : "${FOLDER:?mandatory}"
          mkdir -p "$FOLDER" "$FOLDER/dist" "$FOLDER/out"

      - name: C04 - Pull tool image
        run: |
          set -eu
          : "${IMAGE:?mandatory}"
          docker pull "$IMAGE"

      - name: C04 - Build artifact
        run: |
          set -eu
          zip -j "$FOLDER/dist/contoh-app.zip" test/ci/contoh-app.txt

      - name: C04 - Sign manifest
        env:
          SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY_ED25519 }}
        run: |
          set -eu
          : "${SIGNING_KEY:?mandatory}"

          # Berkas kunci privat sementara dari secret CI/CD
          SIGNING_KEY_FILE="$(mktemp)"
          trap 'rm -f "$SIGNING_KEY_FILE"' 0
          printf "%s\n" "$SIGNING_KEY" > "$SIGNING_KEY_FILE"
          chmod 400 "$SIGNING_KEY_FILE"

          # Sign 
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output" \
            -v "$SIGNING_KEY_FILE:/run/signing.key.pem:ro" \
