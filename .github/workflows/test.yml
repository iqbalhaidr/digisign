        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}

  # =========================================================================

  c05:
    name: "C05"
    runs-on: ubuntu-latest
    env:
      FOLDER: c05
    steps:
      - name: C05 - Checkout repository
        uses: actions/checkout@v7

      - name: C05 - Setup folder for artifacts
        run: |
          set -eu
          : "${FOLDER:?mandatory}"
          mkdir -p "$FOLDER" "$FOLDER/dist" "$FOLDER/out"

      - name: C05 - Pull tool image
        run: |
          set -eu
          : "${IMAGE:?mandatory}"
          docker pull "$IMAGE"

      - name: C05 - Build artifact
        run: |
          set -eu
          zip -j "$FOLDER/dist/contoh-app.zip" test/ci/contoh-app.txt

      - name: C05 - Test --help, --version
        run: |
          set -eu
          docker run --rm --network none --user "$(id -u):$(id -g)" "$IMAGE" --version > "$FOLDER/out/c05_version.txt"
          docker run --rm --network none --user "$(id -u):$(id -g)" "$IMAGE" --help > "$FOLDER/out/c05_help.txt"

      - name: C05 - Test keygen, trust add, trust list
        run: |
          set -eu

          # Trust keygen
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/out:/work" \
            "$IMAGE" keygen --algorithm ed25519 --out /work/c05_ed25519

          chmod 400 "$FOLDER/out/c05_ed25519.key.pem"

          # Trust add
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/out:/work" \
            "$IMAGE" trust add --key /work/c05_ed25519.pub.pem \
            --package contoh-app --store /work/c05_trust.json

          # Trust list (before remove)
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/out:/work:ro" \
            "$IMAGE" trust list --store /work/c05_trust.json \
            > "$FOLDER/out/c05_trust_list_before.txt"

      - name: C05 - Sign manifest
        run: |
          set -eu
          trap 'rm -f "$FOLDER/out/c05_ed25519.key.pem"' 0

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output" \
            -v "$PWD/$FOLDER/out/c05_ed25519.key.pem:/run/signing.key.pem:ro" \
            "$IMAGE" sign --file /input/contoh-app.zip \
            --package contoh-app --version 1.0.0 \
            --key /run/signing.key.pem --out /output/rilis.json

      - name: C05 - Verify release
        run: |
          set -eu
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/dist:/input:ro" \
            -v "$PWD/$FOLDER/out:/output:ro" \
            "$IMAGE" verify --file /input/contoh-app.zip \
            --bundle /output/rilis.json --trust-store /output/c05_trust.json \
            --package contoh-app --version 1.0.0 --json \
            > "$FOLDER/verification.json"

      - name: C05 - File ownership
        run: |
          set -eu

          # File ownership
          echo "Runner UID:GID            : $(id -u):$(id -g)"
          echo "rilis.json UID:GID        : $(stat -c '%u:%g' "$FOLDER/out/rilis.json")"
          echo "verification.json UID:GID : $(stat -c '%u:%g' "$FOLDER/verification.json")"

      - name: C05 - Test trust remove
        run: |
          set -eu
          KEY_ID="$(python3 -c '
          import json, os
          path = os.path.join(os.environ["FOLDER"], "out", "c05_trust.json")
          with open(path) as f:
              data = json.load(f)
          print(data["keys"][0]["key_id"])
          ')"

          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/out:/work" \
            "$IMAGE" trust remove --keyid "$KEY_ID" --store /work/c05_trust.json

          # Trust list (after remove)
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/$FOLDER/out:/work:ro" \
            "$IMAGE" trust list --store /work/c05_trust.json \
            > "$FOLDER/out/c05_trust_list_after.txt"
      
      - name: C05 - Publish or deploy
        run: |
          set -eu
          # Simulasi deploy dengan pembuatan berkas penanda
          echo "[C05] DEPLOYED: contoh-app v1.0.0 (ed25519)" > "$FOLDER/out/deploy.marker"

      - name: C05 - Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.FOLDER }}
          path: ${{ env.FOLDER }}
